{% extends 'base.html' %}

{% block content %}
<div class="container quiz-page">

<div class="quiz-header">
    <div class="container d-flex justify-content-between align-items-center">
        <a href="{% url 'quiz_list' %}" class="home-link">
            🏠 لیست آزمون ها
        </a>

    </div>
</div>




    <div class="quiz-card">

        <h1 class="quiz-title">{{ quiz.title }}</h1>

        <p class="quiz-desc">
            {{ quiz.description }}
        </p>

        <div class="quiz-info">
            <div class="info-box">
                تعداد سوالات: {{ questions.count }}
            </div>
            <div class="info-box">
                نوع آزمون: چهارگزینه‌ای
            </div>
            <!-- اگر داشتی -->
            <!-- <div class="info-box">مدت زمان: ۳۰ دقیقه</div> -->
            <!-- <div class="info-box">سطح: متوسط</div> -->
        </div>

        <div class="start-area">
            <a href="{% url 'home' %}">
                شروع آزمون
            </a>
        </div>

    </div>
</div>

{% endblock %}
