
{% load static %}

<link rel="stylesheet" href="{% static 'css/navbar.css' %}">

<nav class="navbar" id="navbar" dir="rtl">
    <div class="navbar-container">

        <div class="site-identity">
            <a href="{% url 'quizzes:home' %}">
                <span class="logo-mark">AR</span>
                <span class="logo-text">AR TEST</span>
            </a>
        </div>

        <button class="menu-toggle" id="menuToggle"
                type="button" aria-label="باز کردن منو"
                aria-expanded="false" aria-controls="navLinks">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <ul class="nav-links" id="navLinks">

            <li>
                <a href="{% url 'quizzes:home' %}"
                   class="nav-link{% if request.resolver_match.url_name == 'home' %} active{% endif %}">
                    خانه
                </a>
            </li>

            <li>
                <a href="{% url 'quizzes:about' %}"
                   class="nav-link{% if request.resolver_match.url_name == 'about' %} active{% endif %}">
                    درباره ما
                </a>
            </li>

            <li>
                <a href="/admin/" class="nav-link admin-btn">
                    پنل مدیریت
                </a>
            </li>

            {% if user.is_authenticated %}

                <li>
                    <a href="{% url 'accounts:dashboard' %}"
                       class="nav-link{% if request.resolver_match.url_name == 'dashboard' %} active{% endif %}">
                        داشبورد
                    </a>
                </li>

                <li>
                    <a href="{% url 'quizzes:my_attempts' %}"
                       class="nav-link{% if request.resolver_match.url_name == 'my_attempts' %} active{% endif %}">
                        مرور آزمون‌های من
                    </a>
                </li>

                <li>
                    <a href="{% url 'quizzes:subscribe' %}"
                       class="nav-link{% if request.resolver_match.url_name == 'subscribe' %} active{% endif %}">
                        اشتراک
                    </a>
                </li>

                <li>
                    <a href="{% url 'accounts:leaderboard' %}"
                       class="nav-link{% if request.resolver_match.url_name == 'leaderboard' %} active{% endif %}">
                        رتبه‌بندی
                    </a>
                </li>

                <li class="mobile-logout">
                    <form method="post" action="{% url 'accounts:logout' %}">
                        {% csrf_token %}
                        <button type="submit" class="nav-logout">
                            خروج از حساب
                        </button>
                    </form>
                </li>

            {% endif %}
        </ul>

        <div class="auth-controls">
            {% if not user.is_authenticated %}
                <a href="{% url 'accounts:login' %}" class="auth-login">
                    ورود
                </a>

                <a href="{% url 'accounts:register' %}" class="auth-register">
                    ثبت‌نام
                </a>
            {% else %}
                <form method="post" action="{% url 'accounts:logout' %}">
                    {% csrf_token %}
                    <button type="submit" class="auth-logout">
                        خروج
                    </button>
                </form>
            {% endif %}
        </div>

    </div>
</nav>

<script>
document.addEventListener('DOMContentLoaded', function () {
    const menuToggle = document.getElementById('menuToggle');
    const navLinks = document.getElementById('navLinks');

    if (!menuToggle || !navLinks) return;

    function closeMenu() {
        menuToggle.classList.remove('active');
        navLinks.classList.remove('active');
        menuToggle.setAttribute('aria-expanded', 'false');
    }

    menuToggle.addEventListener('click', function (event) {
        event.stopPropagation();

        const isOpen = navLinks.classList.toggle('active');
        menuToggle.classList.toggle('active', isOpen);
        menuToggle.setAttribute('aria-expanded', String(isOpen));
    });

    navLinks.querySelectorAll('a').forEach(function (link) {
        link.addEventListener('click', closeMenu);
    });

    document.addEventListener('click', function (event) {
        if (!navLinks.contains(event.target) &&
            !menuToggle.contains(event.target)) {
            closeMenu();
        }
    });

    window.addEventListener('resize', function () {
        if (window.innerWidth > 1050) closeMenu();
    });
});
</script>
