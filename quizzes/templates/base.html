
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    {% load static %}

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}سایت آزمون{% endblock %}</title>

    <link rel="shortcut icon" href="{% static 'image/logoo.png' %}" type="image/x-icon">

    <!-- فونت و استایل‌های صفحات -->
    <link rel="stylesheet" href="{% static 'css/about-page.css' %}">
    <link rel="stylesheet" href="{% static 'css/analysis-page.css' %}">
    <link rel="stylesheet" href="{% static 'css/home-page.css' %}">
    <link rel="stylesheet" href="{% static 'css/quiz-list.css' %}">
    <link rel="stylesheet" href="{% static 'css/results.css' %}">
    <link rel="stylesheet" href="{% static 'css/subscribe.css' %}">



    <style>
        /* تنظیمات عمومی */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            min-height: 100%;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        /* تم اصلی تمام صفحات */
        body {
            font-family: 'Vazir', 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(
                135deg,
                #f4f9ff 0%,
                #e8f3ff 50%,
                #f8fbff 100%
            );
            background-attachment: fixed;
            color: #24456b;
            line-height: 1.6;
        }

        /* دکمه‌های ورود و ثبت‌نام */
        .auth-buttons {
            position: fixed;
            top: 20px;
            left: 20px;
            display: flex;
            gap: 15px;
            z-index: 1000;
        }

        .btn-neon {
            padding: 12px 25px;
            border-radius: 50px;
            font-weight: 700;
            text-decoration: none;
            color: white;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            border: 1px solid rgba(255,255,255,0.3);
            font-size: 15px;
        }

        .login-neon {
            background: linear-gradient(135deg, #36b5f5, #0875ee);
            box-shadow: 0 5px 18px rgba(8,117,238,0.2);
        }

        .login-neon:hover {
            transform: translateY(-3px);
            box-shadow: 0 9px 25px rgba(8,117,238,0.3);
        }

        .register-neon {
            background: linear-gradient(135deg, #ff72a8, #f13b83);
            box-shadow: 0 5px 18px rgba(241,59,131,0.2);
        }

        .register-neon:hover {
            transform: translateY(-3px);
            box-shadow: 0 9px 25px rgba(241,59,131,0.3);
        }

        /* محتوای اصلی */
        main {
            min-height: 100vh;
            padding: 100px 20px 40px;
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
        }

        /* کارت‌ها و کانتینرهای عمومی */
        .container {
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 12px 35px rgba(65, 130, 190, 0.10);
            border: 1px solid #e2efff;
            margin-bottom: 35px;
        }

        /* عنوان‌های عمومی */
        h1, h2, h3 {
            color: #24456b;
            margin-bottom: 25px;
            font-weight: 800;
            background: none;
            -webkit-text-fill-color: #24456b;
        }

        /* لینک‌های عمومی */
        a {
            transition: color 0.2s ease;
        }

        /* پیام‌ها */
        .messages .alert {
            border-radius: 16px;
            border: 1px solid #e0edfc;
            padding: 18px 25px;
            margin-bottom: 20px;
            background: #ffffff;
            box-shadow: 0 5px 18px rgba(40, 100, 170, 0.07);
        }

        /* جدول‌ها */
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            background: #ffffff;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(40, 100, 170, 0.08);
        }

        @media (max-width: 768px) {
            .auth-buttons {
                top: 15px;
                left: 15px;
                gap: 8px;
            }

            main {
                padding: 85px 15px 25px;
            }

            .container {
                padding: 25px 18px;
                margin: 0 5px 25px;
            }

            .btn-neon {
                padding: 10px 17px;
                font-size: 13px;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 2rem;
            }

            h2 {
                font-size: 1.7rem;
            }

            .container {
                padding: 20px 15px;
            }
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>

<body>

    {% include 'includes/navbar.html' %}

    <main>
        {% block content %}
        {% endblock %}
    </main>

    {% block extra_js %}{% endblock %}

    <!-- فایل‌های JavaScript -->
    <script src="{% static 'js/home-page.js' %}"></script>
    <script src="{% static 'js/quiz-list.js' %}"></script>
    <script src="{% static 'js/results.js' %}"></script>

</body>
</html>
